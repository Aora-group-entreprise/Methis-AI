<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080c15"><title>Méthis AI · Workspace</title><style>
:root{--bg:#080c15;--p:#0d1220;--p2:#11172a;--l:#252c45;--t:#f7f8ff;--m:#858caf;--g:linear-gradient(135deg,#ff4ecd,#7a5cff,#4ecdc4)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px system-ui,sans-serif}.shell{min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:235px;background:#0a0f1a;border-right:1px solid var(--l);padding:18px 12px}.brand{font-weight:800;padding:5px 10px 25px}.nav{display:grid;gap:5px}.nav button{height:43px;border:0;border-radius:10px;background:none;color:#fff;text-align:left;padding:0 13px;font-weight:650}.nav button:hover,.nav .on{background:var(--p2);box-shadow:inset 2px 0 #ff4ecd}.bottom{position:absolute;bottom:20px;color:var(--m);font-size:10px;padding:0 10px}.main{margin-left:235px}.top{height:62px;border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;padding:0 25px;position:sticky;top:0;background:#080c15e8;backdrop-filter:blur(12px);z-index:2}.status{font-size:11px;color:var(--m)}.status b{color:#4ecdc4}.avatar{margin-left:12px;display:inline-grid;place-items:center;width:33px;height:33px;border:1px solid var(--l);border-radius:9px}.content{max-width:1100px;margin:auto;padding:38px 28px}.welcome h1{margin:0;font-size:28px;letter-spacing:-.04em}.welcome p{color:var(--m);margin:7px 0}.grid{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:18px;margin-top:27px}.card{background:var(--p);border:1px solid var(--l);border-radius:16px;padding:19px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.title{font-weight:750}.tabs button{height:34px;padding:0 13px;border:1px solid var(--l);border-radius:9px;background:none;color:#fff;font-size:11px}.tabs .on{border:0;background:var(--g)}.row{display:flex;gap:8px}input,textarea{width:100%;background:#090e19;border:1px solid var(--l);border-radius:10px;color:#fff;outline:0;padding:12px;font-size:12px}input{height:45px}textarea{min-height:110px;margin-top:9px;resize:vertical}.primary{border:0;border-radius:10px;background:var(--g);color:#fff;font-weight:800;padding:0 16px}.actions{text-align:right;margin-top:9px}.ghost{height:40px;border:1px solid var(--l);background:none;border-radius:9px;color:#fff;padding:0 14px;margin-right:7px}.run{height:40px;border:0;border-radius:9px;background:var(--g);color:#fff;padding:0 17px;font-weight:800}.result{display:none;border-top:1px solid var(--l);margin-top:16px;padding-top:16px}.result.show{display:block}.result pre{white-space:pre-wrap;background:#090e19;border:1px solid var(--l);border-radius:9px;padding:12px;font-size:10px;color:#cdd2ee}.project{padding:13px;border:1px solid var(--l);border-radius:10px;background:#0a0f1a}.muted{color:var(--m);font-size:10px}.quick{display:grid;gap:7px;margin-top:15px}.quick button{height:38px;border:1px solid var(--l);background:none;border-radius:9px;color:#fff;text-align:left;padding:0 11px;font-size:11px}.mobile{display:none}@media(max-width:800px){.side{transform:translateX(-100%);transition:.2s;width:245px;z-index:5}.side.open{transform:none}.main{margin-left:0}.mobile{display:inline-block;background:none;border:1px solid var(--l);border-radius:8px;color:#fff;height:34px}.top{padding:0 14px}.content{padding:25px 15px}.grid{grid-template-columns:1fr}.status{display:none}}
 .workspace-page{display:none;height:calc(100vh - 62px);overflow:hidden}.workspace-page.open{display:grid;grid-template-columns:230px minmax(0,1fr) 310px;grid-template-rows:1fr 190px}.files{border-right:1px solid var(--l);background:#090e18;padding:14px;overflow:auto}.files h3,.agent h3{font-size:11px;color:var(--m);text-transform:uppercase;letter-spacing:.08em;margin:0 0 12px}.file{width:100%;border:0;background:none;color:#dfe3ff;text-align:left;padding:8px 9px;border-radius:7px;font-size:11px}.file:hover,.file.active{background:var(--p2)}.editor{min-width:0;display:flex;flex-direction:column}.editorbar{height:40px;border-bottom:1px solid var(--l);display:flex;align-items:center;gap:8px;padding:0 12px;background:#0b101b}.editorbar span{font-size:10px;color:var(--m)}.code{margin:0;flex:1;width:100%;min-height:0;resize:none;outline:0;border:0;border-radius:0;overflow:auto;padding:16px;background:#080c15;color:#cdd2ee;font:11px/1.8 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre}.agent{border-left:1px solid var(--l);background:#0a0f19;padding:15px;overflow:auto}.agentbox{background:var(--p);border:1px solid var(--l);border-radius:10px;padding:12px;font-size:11px;line-height:1.5;color:#cdd2ee}.agent-input{width:100%;min-height:75px;margin-top:9px}.agent-run{width:100%;height:38px;margin-top:8px}.terminal{grid-column:1/-1;border-top:1px solid var(--l);background:#070b13;overflow:auto;padding:11px 15px;font:10px/1.7 ui-monospace,monospace;color:#aeb5d7}.terminal b{color:#4ecdc4}.workspace-mobile{display:none}@media(max-width:900px){.workspace-page.open{grid-template-columns:190px minmax(0,1fr)}.agent{display:none}}@media(max-width:650px){.workspace-page.open{grid-template-columns:1fr;grid-template-rows:auto 1fr 150px}.files{display:none}.workspace-page.open.mobile-files .files{display:block;position:absolute;inset:62px auto 0 0;width:240px;z-index:6}.editorbar .mobile-files-btn{display:block}.code{font-size:10px}.terminal{grid-column:1}.workspace-mobile{display:block}}@media(min-width:651px){.mobile-files-btn{display:none}}</head><body>
<aside id="side" class="side"><div class="brand">✦ Méthis AI</div><nav class="nav"><button class="on" data-s="Projects">⌂ &nbsp; Projects</button><button data-s="Analyze">⌕ &nbsp; Analyze</button><button data-s="Fix">✦ &nbsp; Fix</button><button data-s="AI Agent">◈ &nbsp; AI Agent</button><button data-s="GitHub">◉ &nbsp; GitHub</button><button data-s="Settings">⚙ &nbsp; Settings</button></nav><div class="bottom">Méthis AI · Aora Group</div></aside>
<main class="main"><header class="top"><div><button id="menu" class="mobile">☰</button> <b id="section">Projects</b></div><div class="status"><b>●</b> Engine ready <span class="avatar">M</span></div></header>
<div id="dashboard" class="content"><section class="welcome"><h1>Build with Méthis.</h1><p>Connect a repository, understand the code, then fix one problem at a time.</p></section><div class="grid"><section class="card"><div class="head"><span class="title">Workspace</span><div class="tabs"><button id="a" class="on">Analyze</button> <button id="f">Fix</button></div></div><div class="row"><input id="repo" placeholder="https://github.com/owner/repository"><button id="connect" class="primary">Connect</button></div><textarea id="problem" placeholder="For Fix: describe the problem Méthis should investigate."></textarea><div class="actions"><button id="clear" class="ghost">Clear</button><button id="run" class="run">Run Analyze</button></div><div id="result" class="result"><b id="rt">Analysis</b><pre id="out"></pre></div></section><aside class="card"><b>Current project</b><div class="project" style="margin-top:13px"><div id="pn">No repository connected</div><div id="pm" class="muted" style="margin-top:5px">Connect GitHub to begin.</div></div><b style="display:block;margin-top:22px">Workspace</b><div class="quick"><button id="openWorkspace">▣ Open Workspace</button><button data-s="Analyze">⌕ Analyze repository</button><button data-s="Fix">✦ Fix a problem</button><button data-s="AI Agent">◈ Open AI Agent</button><button data-s="GitHub">◉ GitHub workflow</button><button data-s="Settings">⚙ Settings</button></div></aside></div></div>
<section id="workspace" class="workspace-page"><aside class="files"><h3>Files</h3><div id="fileTree"><div class="muted">Connect a repository to load files.</div></div></aside><section class="editor"><div class="editorbar"><button class="mobile-files-btn ghost" id="filesBtn">Files</button><span id="fileName">No file selected</span><span id="branchName">main</span><span id="branchLabel" style="margin-left:auto">main</span><button class="ghost" id="workspaceVerify">Verify</button><button class="ghost" id="workspaceSave">Save</button><button class="run" id="workspacePr">Pull Request</button></div><textarea id="code" class="code" spellcheck="false">// Méthis workspace\n// Connect a GitHub repository to inspect the real files.</textarea></section><aside class="agent"><h3>Méthis AI Agent</h3><div class="agentbox">I can inspect the repository currently open in this workspace.</div><textarea id="agentInput" class="agent-input" placeholder="Ask Méthis about this code..."></textarea><button id="agentRun" class="run agent-run">Ask Méthis</button></aside><div class="terminal"><b>$ methis workspace</b><br><span id="term">Waiting for a repository...</span></div></section></main>
<script>
const $=x=>document.getElementById(x);
let mode='analyze',workspaceRepo=localStorage.getItem('methis-repository')||'',workspaceRef='main',workspaceBranch='',workspaceFiles=[],currentFile=null;
function setMode(x){mode=x;$('a').classList.toggle('on',x==='analyze');$('f').classList.toggle('on',x==='fix');$('run').textContent=x==='analyze'?'Run Analyze':'Run Fix'}
function section(x){if(x==='AI Agent'){location.href='/app/agent/?repo='+encodeURIComponent($('repo').value.trim());return}if(x==='GitHub'){location.href='/app/github/';return}if(x==='Analyze'){location.href='/app/analyze/?repo='+encodeURIComponent($('repo').value.trim());return}if(x==='Fix'){location.href='/app/fix/?repo='+encodeURIComponent($('repo').value.trim());return}if(x==='Settings'){location.href='/app/settings/';return}$('section').textContent=x;$('side').classList.remove('open')}
document.querySelectorAll('[data-s]').forEach(x=>x.onclick=()=>section(x.dataset.s));
$('a').onclick=()=>setMode('analyze');$('f').onclick=()=>setMode('fix');$('menu').onclick=()=>$('side').classList.toggle('open');
$('clear').onclick=()=>{$('repo').value='';$('problem').value='';$('result').classList.remove('show')};
function saveRepo(){workspaceRepo=$('repo').value.trim();if(workspaceRepo)localStorage.setItem('methis-repository',workspaceRepo)}
async function connectRepo(){saveRepo();if(!workspaceRepo)return;try{let r=await fetch('/api/analyze',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({repository:workspaceRepo})}),d=await r.json();if(!r.ok)throw Error(d.error||'Connection failed');$('pn').textContent=d.repository?.name||workspaceRepo;$('pm').textContent=(d.files||0)+' files · '+(d.languages||[]).join(', ');$('term').textContent='Repository connected · workspace ready'}catch(e){alert(e.message)}}
$('connect').onclick=connectRepo;
$('run').onclick=async()=>{let repo=$('repo').value.trim();if(!repo)return alert('Connect a GitHub repository first.');if(mode==='fix'&&!$('problem').value.trim())return alert('Describe the problem first.');saveRepo();$('result').classList.add('show');$('out').textContent='Méthis is working…';try{let endpoint=mode==='analyze'?'/api/analyze':'/api/github-fix';let body=mode==='analyze'?{repository:repo}:{repository:repo,problem:$('problem').value.trim()};let r=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');$('rt').textContent=mode==='analyze'?'Analysis ready':'Fix ready';$('out').textContent=mode==='analyze'?('Repository: '+(d.repository?.name||repo)+'\nFiles: '+d.files+'\nLanguages: '+(d.languages||[]).join(', ')+'\nStatus: '+d.status):('Summary: '+(d.summary||'Fix created.')+'\nChanged: '+(d.changedFiles||[]).join(', ')+'\nPR: '+(d.pullRequest||'created'))}catch(e){$('out').textContent=e.message)}};
function escapeHtml(v){return String(v).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function renderTree(files){const tree=$('fileTree');tree.innerHTML='';const groups={};files.forEach(f=>{const parts=f.path.split('/');let node=groups;parts.forEach((part,i)=>{if(i===parts.length-1){node[part]={__file:f}}else{node[part]??={};node=node[part]}}});function render(node,prefix=''){Object.keys(node).sort((a,b)=>{const ad=!!node[a].__file,bd=!!node[b].__file;return ad-bd||a.localeCompare(b)}).forEach(name=>{const item=node[name];if(item.__file){const b=document.createElement('button');b.className='file';b.textContent='  '+name;b.onclick=()=>openFile(item.__file);tree.appendChild(b)}else{const h=document.createElement('button');h.className='file';h.textContent='▾ '+name;h.onclick=()=>h.classList.toggle('active');tree.appendChild(h);render(item,prefix+name+'/')}})}render(treeData(files))}
function treeData(files){const root={};for(const f of files){let n=root;const p=f.path.split('/');p.forEach((part,i)=>{if(i===p.length-1)n[part]={__file:f};else n=n[part]??={}})}return root}
async function loadWorkspace(repo){workspaceRepo=repo;localStorage.setItem('methis-repository',repo);$('term').textContent='Loading real repository tree…';try{const r=await fetch('/api/workspace/tree',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({repository:repo})});const d=await r.json();if(!r.ok)throw Error(d.error||'Workspace load failed');workspaceRef=d.branch||'main';workspaceBranch='';workspaceFiles=d.files||[];$('branchName').textContent=workspaceRef;$('branchLabel').textContent=workspaceRef;$('term').textContent='✓ '+workspaceFiles.length+' files loaded from GitHub';renderTree(workspaceFiles)}catch(e){$('term').textContent='✕ '+e.message;throw e}}
async function openFile(file){document.querySelectorAll('.file').forEach(b=>b.classList.remove('active'));$('fileName').textContent=file.path;$('term').textContent='Loading '+file.path+'…';try{const r=await fetch('/api/workspace/file',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({repository:workspaceRepo,path:file.path,ref:workspaceRef})});const d=await r.json();if(!r.ok)throw Error(d.error||'File load failed');currentFile=file;$('code').value=d.content;$('term').textContent='Opened '+file.path+' · '+file.size+' bytes'}catch(e){$('code').value='// '+e.message;$('term').textContent='✕ '+e.message}}
$('openWorkspace').onclick=async()=>{saveRepo();if(!workspaceRepo)return alert('Connect a GitHub repository first.');$('dashboard').style.display='none';$('workspace').classList.add('open');$('section').textContent='Workspace';try{await loadWorkspace(workspaceRepo)}catch{}};
$('workspaceSave').onclick=async()=>{if(!workspaceRepo||!currentFile)return alert('Open a file first.');$('term').textContent='Saving changes to a Méthis branch…';try{const r=await fetch('/api/workspace/save',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({repository:workspaceRepo,path:currentFile.path,content:$('code').value,baseBranch:workspaceRef,branch:workspaceBranch})});const d=await r.json();if(!r.ok)throw Error(d.error||'Save failed');workspaceBranch=d.branch;$('branchLabel').textContent=d.branch;$('term').textContent='✓ Saved '+currentFile.path+' · branch '+d.branch}catch(e){$('term').textContent='✕ '+e.message}};
$('workspaceVerify').onclick=async()=>{if(!workspaceRepo||!workspaceBranch)return alert('Save a change first.');$('term').textContent='Checking GitHub Actions…';try{const r=await fetch('/api/workspace/verify',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({repository:workspaceRepo,branch:workspaceBranch})});const d=await r.json();if(!r.ok)throw Error(d.message||d.error||'Verification failed');$('term').textContent=d.verified?'✓ CI passed · '+(d.workflow||'GitHub Actions'):'⏳ CI '+(d.status||'pending')+' · run again when completed'}catch(e){$('term').textContent='✕ '+e.message}};
$('workspacePr').onclick=async()=>{if(!workspaceRepo||!workspaceBranch)return alert('Save a change first.');$('term').textContent='Verifying before Pull Request…';try{const vr=await fetch('/api/workspace/verify',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({repository:workspaceRepo,branch:workspaceBranch})});const vd=await vr.json();if(!vr.ok||!vd.verified)throw Error(vd.message||'Verification has not passed. Pull Request blocked.');const title=prompt('Pull Request title','Méthis AI changes');if(!title)return;const r=await fetch('/api/workspace/pr',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({repository:workspaceRepo,branch:workspaceBranch,baseBranch:workspaceRef,title,body:'Changes prepared and verified in the Méthis AI workspace.'})});const d=await r.json();if(!r.ok)throw Error(d.error||'Pull Request failed');$('term').textContent='✓ Pull Request created: '+(d.pullRequest||'#'+d.pullRequestNumber);if(d.pullRequest)window.open(d.pullRequest,'_blank','noopener')}catch(e){$('term').textContent='✕ '+e.message}};
$('workspaceRun').onclick=async()=>{if(!workspaceRepo)return;$('term').textContent='Running repository analysis…';try{const r=await fetch('/api/analyze',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({repository:workspaceRepo})});const d=await r.json();if(!r.ok)throw Error(d.error||'Analysis failed');$('term').textContent='✓ '+d.files+' files analyzed · '+(d.languages||[]).join(', ')}catch(e){$('term').textContent='✕ '+e.message}};
$('agentRun').onclick=async()=>{const q=$('agentInput').value.trim();if(!q)return;if(!workspaceRepo)return alert('Connect a GitHub repository first.');$('term').textContent='Méthis Agent is reading the repository and preparing safe edits…';try{const r=await fetch('/api/workspace/agent',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({repository:workspaceRepo,task:q,baseBranch:workspaceRef})});const d=await r.json();if(!r.ok)throw Error(d.error||'Agent failed');workspaceBranch=d.branch;$('branchLabel').textContent=d.branch;$('agentInput').value='';$('term').textContent='✓ Agent applied '+(d.changedFiles||[]).length+' safe change(s) on '+d.branch+'. Run Verify before Pull Request.'}catch(e){$('term').textContent='✕ '+e.message}};
$('filesBtn').onclick=()=>$('workspace').classList.toggle('mobile-files');
const savedRepo=localStorage.getItem('methis-repository');if(savedRepo){$('repo').value=savedRepo;$('pn').textContent=savedRepo.split('/').filter(Boolean).pop()||savedRepo;$('pm').textContent='Saved repository'} 
</script></body></html>
