<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080c15"><title>Méthis AI · Workspace</title><style>
:root{--bg:#080c15;--p:#0d1220;--p2:#11172a;--l:#252c45;--t:#f7f8ff;--m:#858caf;--g:linear-gradient(135deg,#ff4ecd,#7a5cff,#4ecdc4)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px system-ui,sans-serif}.shell{min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:235px;background:#0a0f1a;border-right:1px solid var(--l);padding:18px 12px}.brand{font-weight:800;padding:5px 10px 25px}.nav{display:grid;gap:5px}.nav button{height:43px;border:0;border-radius:10px;background:none;color:#fff;text-align:left;padding:0 13px;font-weight:650}.nav button:hover,.nav .on{background:var(--p2);box-shadow:inset 2px 0 #ff4ecd}.bottom{position:absolute;bottom:20px;color:var(--m);font-size:10px;padding:0 10px}.main{margin-left:235px}.top{height:62px;border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;padding:0 25px;position:sticky;top:0;background:#080c15e8;backdrop-filter:blur(12px);z-index:2}.status{font-size:11px;color:var(--m)}.status b{color:#4ecdc4}.avatar{margin-left:12px;display:inline-grid;place-items:center;width:33px;height:33px;border:1px solid var(--l);border-radius:9px}.content{max-width:1100px;margin:auto;padding:38px 28px}.welcome h1{margin:0;font-size:28px;letter-spacing:-.04em}.welcome p{color:var(--m);margin:7px 0}.grid{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:18px;margin-top:27px}.card{background:var(--p);border:1px solid var(--l);border-radius:16px;padding:19px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.title{font-weight:750}.tabs button{height:34px;padding:0 13px;border:1px solid var(--l);border-radius:9px;background:none;color:#fff;font-size:11px}.tabs .on{border:0;background:var(--g)}.row{display:flex;gap:8px}input,textarea{width:100%;background:#090e19;border:1px solid var(--l);border-radius:10px;color:#fff;outline:0;padding:12px;font-size:12px}input{height:45px}textarea{min-height:110px;margin-top:9px;resize:vertical}.primary{border:0;border-radius:10px;background:var(--g);color:#fff;font-weight:800;padding:0 16px}.actions{text-align:right;margin-top:9px}.ghost{height:40px;border:1px solid var(--l);background:none;border-radius:9px;color:#fff;padding:0 14px;margin-right:7px}.run{height:40px;border:0;border-radius:9px;background:var(--g);color:#fff;padding:0 17px;font-weight:800}.result{display:none;border-top:1px solid var(--l);margin-top:16px;padding-top:16px}.result.show{display:block}.result pre{white-space:pre-wrap;background:#090e19;border:1px solid var(--l);border-radius:9px;padding:12px;font-size:10px;color:#cdd2ee}.project{padding:13px;border:1px solid var(--l);border-radius:10px;background:#0a0f1a}.muted{color:var(--m);font-size:10px}.quick{display:grid;gap:7px;margin-top:15px}.quick button{height:38px;border:1px solid var(--l);background:none;border-radius:9px;color:#fff;text-align:left;padding:0 11px;font-size:11px}.mobile{display:none}@media(max-width:800px){.side{transform:translateX(-100%);transition:.2s;width:245px;z-index:5}.side.open{transform:none}.main{margin-left:0}.mobile{display:inline-block;background:none;border:1px solid var(--l);border-radius:8px;color:#fff;height:34px}.top{padding:0 14px}.content{padding:25px 15px}.grid{grid-template-columns:1fr}.status{display:none}}
</style></head><body><aside id="side" class="side"><div class="brand">✦ Méthis AI</div><nav class="nav"><button class="on" data-s="Projects">⌂ &nbsp; Projects</button><button data-s="Analyze">⌕ &nbsp; Analyze</button><button data-s="Fix">✦ &nbsp; Fix</button><button data-s="AI Agent">◈ &nbsp; AI Agent</button><button data-s="GitHub">◉ &nbsp; GitHub</button><button data-s="Settings">⚙ &nbsp; Settings</button></nav><div class="bottom">Méthis AI · Aora Group</div></aside><main class="main"><header class="top"><div><button id="menu" class="mobile">☰</button> <b id="section">Projects</b></div><div class="status"><b>●</b> Engine ready <span class="avatar">M</span></div></header><div class="content"><section class="welcome"><h1>Build with Méthis.</h1><p>Connect a repository, understand the code, then fix one problem at a time.</p></section><div class="grid"><section class="card"><div class="head"><span class="title">Workspace</span><div class="tabs"><button id="a" class="on">Analyze</button> <button id="f">Fix</button></div></div><div class="row"><input id="repo" placeholder="https://github.com/owner/repository"><button id="connect" class="primary">Connect</button></div><textarea id="problem" placeholder="For Fix: describe the problem Méthis should investigate."></textarea><div class="actions"><button id="clear" class="ghost">Clear</button><button id="run" class="run">Run Analyze</button></div><div id="result" class="result"><b id="rt">Analysis</b><pre id="out"></pre></div></section><aside class="card"><b>Current project</b><div class="project" style="margin-top:13px"><div id="pn">No repository connected</div><div id="pm" class="muted" style="margin-top:5px">Connect GitHub to begin.</div></div><b style="display:block;margin-top:22px">Workspace</b><div class="quick"><button data-s="Analyze">⌕ Analyze repository</button><button data-s="Fix">✦ Fix a problem</button><button data-s="AI Agent">◈ Open AI Agent</button><button data-s="GitHub">◉ GitHub workflow</button><button data-s="Settings">⚙ Settings</button></div></aside></div></div></main><script>
const $=x=>document.getElementById(x);let mode='analyze';function setMode(x){mode=x;$('a').classList.toggle('on',x==='analyze');$('f').classList.toggle('on',x==='fix');$('run').textContent=x==='analyze'?'Run Analyze':'Run Fix'}function section(x){$('section').textContent=x;if(x==='Analyze')setMode('analyze');if(x==='Fix')setMode('fix');if(x==='Projects')$('section').textContent='Projects';$('side').classList.remove('open')}document.querySelectorAll('[data-s]').forEach(x=>x.onclick=()=>section(x.dataset.s));$('a').onclick=()=>setMode('analyze');$('f').onclick=()=>setMode('fix');$('menu').onclick=()=>$('side').classList.toggle('open');$('clear').onclick=()=>{$('repo').value='';$('problem').value='';$('result').classList.remove('show')};$('connect').onclick=async()=>{if(!$('repo').value.trim())return;try{let r=await fetch('/api/analyze',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({repository:$('repo').value.trim()})}),d=await r.json();if(!r.ok)throw Error(d.error||'Connection failed');$('pn').textContent=d.repository?.name||$('repo').value;$('pm').textContent=(d.files||0)+' files · '+(d.languages||[]).join(', ')}catch(e){alert(e.message)}};$('run').onclick=async()=>{let repo=$('repo').value.trim();if(!repo)return alert('Connect a GitHub repository first.');if(mode==='fix'&&!$('problem').value.trim())return alert('Describe the problem first.');$('result').classList.add('show');$('out').textContent='Méthis is working…';try{let endpoint=mode==='analyze'?'/api/analyze':'/api/github-fix';let body=mode==='analyze'?{repository:repo}:{repository:repo,problem:$('problem').value.trim()};let r=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');$('rt').textContent=mode==='analyze'?'Analysis ready':'Fix ready';$('out').textContent=mode==='analyze'?('Repository: '+(d.repository?.name||repo)+'\nFiles: '+d.files+'\nLanguages: '+(d.languages||[]).join(', ')+'\nStatus: '+d.status):('Summary: '+(d.summary||'Fix created.')+'\nChanged: '+(d.changedFiles||[]).join(', ')+'\nPR: '+(d.pullRequest||'created'))}catch(e){$('out').textContent=e.message}};</script></body></html>
